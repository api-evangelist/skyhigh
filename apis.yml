aid: skyhigh
name: Skyhigh Security
description: >-
  Skyhigh Security is a cloud-native Security Service Edge (SSE) platform that protects
  enterprise data across web, cloud, and private applications. Its portfolio spans Cloud
  Access Security Broker (CASB), Secure Web Gateway (SWG), Data Loss Prevention (DLP and
  Advanced DLP), Zero Trust Network Access (ZTNA), and Data Security Posture Management
  (DSPM). Skyhigh exposes REST "SSE APIs" (served from regional myshn.net hosts) for user
  management, querying and modifying DLP/policy incidents, and forensics reporting, secured
  with IAM bearer tokens. Formerly the cloud business of McAfee Enterprise / MVISION Cloud,
  Skyhigh Security is a Greylock-backed cybersecurity company holding FedRAMP High, SOC 2
  Type II, and ISO/IEC 27001 authorizations.
